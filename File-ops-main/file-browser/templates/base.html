<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}File Browser{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="{{ url_for('files.browse', virtual_path='') }}">
          <span class="brand-mark" aria-hidden="true">FB</span>
          <span>File Browser</span>
        </a>
        <span class="status-pill"><span class="status-dot"></span> LAN read-only</span>
      </div>
    </header>
    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
